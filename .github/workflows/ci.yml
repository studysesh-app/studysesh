name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - name: Build demo web export
        run: npm run build:web
        env:
          EXPO_PUBLIC_DEMO_MODE: "true"
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
          EXPO_PUBLIC_ENABLE_PUSH_NOTIFICATIONS: "false"
      - name: Verify demo backend configuration
        run: node scripts/verify-web-env.cjs
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Functions
        run: >-
          deno check --no-lock
          supabase/functions/classmates/index.ts
          supabase/functions/create-conversation/index.ts
          supabase/functions/delete-account/index.ts
          supabase/functions/push-worker/index.ts
